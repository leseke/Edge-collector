<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#0a0a0f">
<title>EDGE</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body {
    background: #0a0a0f;
    color: #e8e8ee;
    font-family: -apple-system, BlinkMacSystemFont, "SF Pro Display", "SF Pro Text", sans-serif;
    font-size: 16px;
    line-height: 1.5;
    min-height: 100vh;
    -webkit-font-smoothing: antialiased;
  }
  body { padding: 0 0 100px; }

  /* ===== HEADER ===== */
  .header {
    padding: 20px 20px 8px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .brand {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #6ee7ff 0%, #a78bfa 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .refresh {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #14141c;
    border: 1px solid #1f1f2a;
    display: flex; align-items: center; justify-content: center;
    color: #94a3b8;
    font-size: 18px;
    cursor: pointer;
    transition: transform 0.3s;
  }
  .refresh:active { transform: rotate(180deg); }

  /* ===== COMMAND CENTER ===== */
  .command {
    margin: 8px 16px 20px;
    padding: 20px;
    background: linear-gradient(135deg, #14141c 0%, #1a1a28 100%);
    border-radius: 22px;
    border: 1px solid #1f1f2a;
    position: relative;
    overflow: hidden;
  }
  .command::before {
    content: "";
    position: absolute;
    top: -50%; right: -20%;
    width: 200px; height: 200px;
    background: radial-gradient(circle, rgba(110,231,255,0.15) 0%, transparent 70%);
    pointer-events: none;
  }
  .command-top {
    display: flex;
    justify-content: space-between;
    align-items: flex-start;
    margin-bottom: 18px;
    position: relative;
  }
  .capital-label {
    font-size: 11px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 6px;
  }
  .capital-value {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
    line-height: 1;
  }
  .capital-value .unit { font-size: 18px; color: #6b7280; font-weight: 500; margin-left: 4px; }
  .edit-capital {
    padding: 6px 12px;
    background: #0a0a12;
    border: 1px solid #1f1f2a;
    border-radius: 10px;
    font-size: 12px;
    color: #94a3b8;
    cursor: pointer;
  }
  .capital-detail {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 12px;
    margin-top: 4px;
    position: relative;
  }
  .capital-detail .item .lbl {
    font-size: 11px; color: #6b7280;
    text-transform: uppercase; letter-spacing: 0.8px;
    margin-bottom: 3px;
  }
  .capital-detail .item .val {
    font-size: 18px; font-weight: 600;
  }
  .capital-detail .item .val.warn { color: #fbbf24; }
  .capital-detail .item .val.ok { color: #4ade80; }

  /* Decision banner */
  .decision {
    margin-top: 18px;
    padding-top: 18px;
    border-top: 1px solid #1f1f2a;
    display: flex;
    align-items: center;
    gap: 12px;
    position: relative;
  }
  .decision .dot {
    width: 10px; height: 10px;
    border-radius: 50%;
    flex-shrink: 0;
  }
  .dot.cash { background: #94a3b8; box-shadow: 0 0 12px rgba(148,163,184,0.5); }
  .dot.buy { background: #4ade80; box-shadow: 0 0 12px rgba(74,222,128,0.6); animation: pulse 2s infinite; }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.5; }
  }
  .decision-text { flex: 1; }
  .decision-text .title {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 2px;
  }
  .decision-text .sub {
    font-size: 12px;
    color: #6b7280;
  }

  /* ===== SECTIONS ===== */
  .section {
    margin: 0 16px 28px;
  }
  .section-title {
    font-size: 11px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 12px;
    padding-left: 4px;
  }

  /* ===== CAROUSEL ===== */
  .carousel {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    scroll-snap-type: x mandatory;
    padding: 4px 16px 12px;
    margin: 0 -16px;
    scrollbar-width: none;
  }
  .carousel::-webkit-scrollbar { display: none; }
  .featured {
    flex: 0 0 78%;
    scroll-snap-align: center;
    background: #14141c;
    border-radius: 20px;
    overflow: hidden;
    border: 1px solid #1f1f2a;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .featured:active { transform: scale(0.97); }
  .featured .img-box {
    width: 100%;
    height: 180px;
    background: #0a0a12;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 64px;
    overflow: hidden;
    position: relative;
  }
  .featured .img-box img {
    width: 100%; height: 100%;
    object-fit: contain;
  }
  .featured .body { padding: 16px; }
  .featured .name {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 10px;
    line-height: 1.35;
    min-height: 40px;
  }
  .featured .price-row {
    display: flex;
    align-items: baseline;
    gap: 10px;
    margin-bottom: 12px;
  }
  .featured .price {
    font-size: 24px;
    font-weight: 700;
    letter-spacing: -0.5px;
  }
  .featured .ecart {
    font-size: 12px;
    color: #6b7280;
  }
  .featured .bottom-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  /* ===== LIST ITEM ===== */
  .item {
    background: #14141c;
    border-radius: 16px;
    padding: 12px 14px;
    display: flex;
    align-items: center;
    gap: 12px;
    margin-bottom: 10px;
    border: 1px solid #1f1f2a;
    cursor: pointer;
    transition: transform 0.15s;
  }
  .item:active { transform: scale(0.98); }
  .item .thumb {
    width: 52px; height: 52px;
    border-radius: 12px;
    background: #0a0a12;
    display: flex; align-items: center; justify-content: center;
    font-size: 24px;
    overflow: hidden;
    flex-shrink: 0;
  }
  .item .thumb img { width: 100%; height: 100%; object-fit: contain; }
  .item .info {
    flex: 1; min-width: 0;
  }
  .item .name {
    font-size: 14px;
    font-weight: 600;
    margin-bottom: 3px;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .item .meta {
    font-size: 12px;
    color: #6b7280;
  }
  .item .meta .price {
    color: #e8e8ee;
    font-weight: 600;
  }
  .item .right { flex-shrink: 0; }

  /* ===== BADGES ===== */
  .badge {
    display: inline-block;
    padding: 5px 10px;
    border-radius: 20px;
    font-size: 10px;
    font-weight: 700;
    text-transform: uppercase;
    letter-spacing: 0.8px;
    white-space: nowrap;
  }
  .badge.buy { background: rgba(74,222,128,0.15); color: #4ade80; }
  .badge.strong_buy { background: rgba(74,222,128,0.28); color: #4ade80; }
  .badge.wait { background: rgba(251,191,36,0.15); color: #fbbf24; }
  .badge.watch { background: rgba(148,163,184,0.15); color: #94a3b8; }
  .badge.no_data, .badge.error { background: rgba(100,116,139,0.15); color: #64748b; }

  /* ===== CYCLE BAR ===== */
  .cycle {
    display: flex;
    gap: 3px;
    margin-top: 6px;
  }
  .cycle .seg {
    flex: 1;
    height: 4px;
    background: #1f1f2a;
    border-radius: 2px;
  }
  .cycle .seg.on { background: #a78bfa; }
  .cycle .seg.on.hot { background: #f87171; }

  /* ===== DETAIL SHEET ===== */
  .overlay {
    position: fixed;
    top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.7);
    backdrop-filter: blur(8px);
    -webkit-backdrop-filter: blur(8px);
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.25s;
    z-index: 100;
  }
  .overlay.open { opacity: 1; pointer-events: auto; }

  .sheet {
    position: fixed;
    bottom: 0; left: 0; right: 0;
    max-height: 92vh;
    background: #0e0e14;
    border-radius: 24px 24px 0 0;
    border-top: 1px solid #1f1f2a;
    transform: translateY(100%);
    transition: transform 0.3s cubic-bezier(0.32, 0.72, 0, 1);
    overflow-y: auto;
    z-index: 101;
    padding-bottom: env(safe-area-inset-bottom, 20px);
  }
  .sheet.open { transform: translateY(0); }
  .sheet-handle {
    width: 40px; height: 4px;
    background: #2a2a36;
    border-radius: 2px;
    margin: 10px auto 0;
  }
  .sheet-img {
    width: 100%;
    height: 220px;
    background: #0a0a12;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 80px;
    overflow: hidden;
  }
  .sheet-img img { width: 100%; height: 100%; object-fit: contain; }
  .sheet-body { padding: 20px 20px 40px; }
  .sheet-title {
    font-size: 22px;
    font-weight: 700;
    letter-spacing: -0.5px;
    margin-bottom: 4px;
    line-height: 1.25;
  }
  .sheet-cat {
    display: inline-block;
    font-size: 10px;
    color: #a78bfa;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    font-weight: 700;
    margin-bottom: 14px;
  }

  .sheet-price-block {
    background: #14141c;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 16px;
    border: 1px solid #1f1f2a;
  }
  .sheet-price-main {
    display: flex;
    justify-content: space-between;
    align-items: baseline;
    margin-bottom: 12px;
  }
  .sheet-price-main .current {
    font-size: 32px;
    font-weight: 700;
    letter-spacing: -1px;
  }
  .sheet-price-main .ecart {
    font-size: 14px;
    font-weight: 600;
    color: #fbbf24;
  }
  .sheet-price-row {
    display: flex;
    justify-content: space-between;
    font-size: 13px;
    padding: 4px 0;
  }
  .sheet-price-row .lbl { color: #6b7280; }
  .sheet-price-row .val { font-weight: 600; }

  .sheet-block {
    background: #14141c;
    border-radius: 16px;
    padding: 16px;
    margin-bottom: 12px;
    border: 1px solid #1f1f2a;
  }
  .sheet-block .lbl {
    font-size: 10px;
    color: #6b7280;
    text-transform: uppercase;
    letter-spacing: 1.2px;
    margin-bottom: 8px;
    font-weight: 700;
  }
  .sheet-block .txt {
    font-size: 14px;
    line-height: 1.55;
    color: #d1d5db;
  }
  .sheet-block .txt.warn { color: #fbbf24; }
  .sheet-block .txt.danger { color: #f87171; }
  .sheet-block .txt.ok { color: #4ade80; }

  .cycle-row {
    display: flex;
    gap: 4px;
    margin: 8px 0 4px;
  }
  .cycle-row .seg {
    flex: 1;
    height: 6px;
    background: #1f1f2a;
    border-radius: 3px;
  }
  .cycle-row .seg.on { background: #a78bfa; }

  /* ===== CAPITAL EDITOR ===== */
  .modal {
    position: fixed;
    top: 50%; left: 50%;
    transform: translate(-50%, -50%) scale(0.9);
    background: #14141c;
    border-radius: 20px;
    padding: 24px;
    width: calc(100% - 48px);
    max-width: 360px;
    border: 1px solid #1f1f2a;
    opacity: 0;
    pointer-events: none;
    transition: opacity 0.2s, transform 0.2s;
    z-index: 200;
  }
  .modal.open { opacity: 1; pointer-events: auto; transform: translate(-50%, -50%) scale(1); }
  .modal-title {
    font-size: 18px;
    font-weight: 700;
    margin-bottom: 6px;
  }
  .modal-sub {
    font-size: 12px;
    color: #6b7280;
    margin-bottom: 18px;
  }
  .modal input {
    width: 100%;
    padding: 14px 16px;
    font-size: 18px;
    font-weight: 600;
    background: #0a0a12;
    border: 1px solid #1f1f2a;
    border-radius: 12px;
    color: #e8e8ee;
    margin-bottom: 16px;
    font-family: inherit;
  }
  .modal input:focus { outline: none; border-color: #6ee7ff; }
  .modal-actions {
    display: flex;
    gap: 10px;
  }
  .modal-actions button {
    flex: 1;
    padding: 14px;
    border-radius: 12px;
    border: none;
    font-size: 15px;
    font-weight: 600;
    font-family: inherit;
    cursor: pointer;
  }
  .btn-cancel {
    background: #1f1f2a;
    color: #94a3b8;
  }
  .btn-save {
    background: linear-gradient(135deg, #6ee7ff, #a78bfa);
    color: #0a0a0f;
  }
  .modal-note {
    font-size: 11px;
    color: #4b5563;
    margin-top: 14px;
    line-height: 1.5;
  }

  /* ===== FOOTER ===== */
  footer {
    padding: 24px 20px 12px;
    font-size: 11px;
    color: #4b5563;
    text-align: center;
    line-height: 1.6;
  }

  /* ===== EMPTY / LOADING ===== */
  .empty {
    text-align: center;
    padding: 60px 20px;
    color: #6b7280;
    font-size: 14px;
  }
  .skeleton {
    background: linear-gradient(90deg, #14141c 0%, #1a1a28 50%, #14141c 100%);
    background-size: 200% 100%;
    animation: shimmer 1.5s infinite;
    border-radius: 12px;
  }
  @keyframes shimmer {
    0% { background-position: 200% 0; }
    100% { background-position: -200% 0; }
  }
  .lab-form { display: flex; flex-direction: column; gap: 8px; margin-top: 8px; }
  .lab-form input, .lab-form select { background: rgba(148,163,184,0.08); border: 1px solid rgba(148,163,184,0.25); color: inherit; border-radius: 10px; padding: 10px 12px; font-size: 15px; }
  .lab-row { display: flex; gap: 8px; }
  .lab-row select { flex: 1; }
  .lab-btn { background: #4ade80; color: #052e16; border: 0; border-radius: 10px; padding: 11px; font-weight: 600; font-size: 15px; }
  .lab-out { font-size: 13px; color: #94a3b8; line-height: 1.5; margin-top: 8px; }
  .lab-out code { display: block; background: rgba(148,163,184,0.1); padding: 8px; border-radius: 8px; margin: 6px 0; word-break: break-all; white-space: pre-wrap; }
  .sim-tag { font-size: 10px; color: #fbbf24; border: 1px solid rgba(251,191,36,0.4); border-radius: 6px; padding: 1px 5px; margin-left: 6px; }
  .badge.insufficient_data { background: rgba(100,116,139,0.15); color: #64748b; }
</style>
</head>
<body>

<div class="header">
  <div class="brand">EDGE</div>
  <div class="refresh" onclick="reload()">↻</div>
</div>

<div id="app">
  <div class="empty">Chargement…</div>
</div>

<!-- Discovery + Search Lab (lecture seule : aucun secret dans le navigateur) -->
<div id="lab"></div>

<!-- EDGE Intelligence Reports v1 (lecture seule, AI-001) -->
<div id="intel"></div>

<footer>
  <div id="footer-stamp"></div>
  <div style="margin-top:6px;">eBay · Cardmarket · Mis à jour à chaque run</div>
</footer>

<!-- Detail sheet -->
<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet">
  <div class="sheet-handle"></div>
  <div id="sheet-content"></div>
</div>

<!-- Capital editor -->
<div class="modal" id="capital-modal">
  <div class="modal-title">Modifier le capital</div>
  <div class="modal-sub">Simulation locale uniquement</div>
  <input type="number" id="capital-input" inputmode="numeric" placeholder="300">
  <div class="modal-actions">
    <button class="btn-cancel" onclick="closeCapital()">Annuler</button>
    <button class="btn-save" onclick="saveCapital()">Appliquer</button>
  </div>
  <div class="modal-note">
    Cette valeur est stockée dans ton navigateur pour simuler différents scénarios. Pour la modifier de façon permanente (pipeline GitHub), édite <code>config.json</code> dans le repo.
  </div>
</div>

<script>
const LABELS = {
  STRONG_BUY: "Achat fort",
  BUY: "Achat",
  WAIT: "Attendre",
  WATCH: "Watch",
  NO_DATA: "Pas de données",
  ERROR: "Erreur",
  INSUFFICIENT_DATA: "Preuves insuffisantes",
  NO_DATA_DISCOVERY: "Pas de données"
};

let RADAR = null;

// Echappement HTML : les titres de produits viennent de sources externes.
function esc(v) {
  return String(v == null ? "" : v)
    .replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;").replace(/'/g, "&#39;");
}

// radar.json V4 ne publie plus le capital : RADAR.config n'existe que
// dans les anciens radars (affichage historique conserve).
function isLegacy() { return !!(RADAR && RADAR.config); }

let SIM_CAPITAL = null;

function loadSimCapital() {
  const v = localStorage.getItem("edge_sim_capital");
  return v ? parseFloat(v) : null;
}

function saveSimCapital(v) {
  if (v == null) localStorage.removeItem("edge_sim_capital");
  else localStorage.setItem("edge_sim_capital", String(v));
  SIM_CAPITAL = v;
}

function getEffectiveCapital() {
  if (!RADAR) return 0;
  if (!isLegacy()) return null;
  return SIM_CAPITAL != null ? SIM_CAPITAL : RADAR.config.capital_monthly;
}

function getAvailableCapital() {
  if (!RADAR) return 0;
  if (!isLegacy()) return null;
  return getEffectiveCapital() - (RADAR.config.capital_engaged || 0);
}

function fmtDate(iso) {
  const d = new Date(iso);
  return d.toLocaleString('fr-FR', {
    day: '2-digit', month: 'short', hour: '2-digit', minute: '2-digit'
  });
}

function thumbHTML(p, size) {
  const s = size || 24;
  if (p.image_url) {
    return `<img src="${p.image_url}" alt="" loading="lazy"
      onerror="this.style.display='none';this.parentNode.innerHTML='${p.emoji}'">`;
  }
  return p.emoji || "?";
}

function cycleHTML(num, total) {
  total = total || 7;
  let html = '<div class="cycle">';
  for (let i = 1; i <= total; i++) {
    let cls = "seg";
    if (i <= num) cls += " on";
    if (i <= num && i >= 5) cls += " hot";
    html += `<div class="${cls}"></div>`;
  }
  html += '</div>';
  return html;
}

function computeAllocRange(product) {
  // V4 : les montants d'allocation sont calcules par le moteur et restent
  // prives. L'interface n'invente aucune allocation.
  if (!isLegacy()) return [0, 0];
  if (product.decision === "NO_DATA" || product.decision === "ERROR") return [0, 0];
  const cap = getAvailableCapital();
  if (product.decision === "BUY" || product.decision === "STRONG_BUY") {
    const lo = RADAR.config.allocation_buy_pct[0];
    const hi = RADAR.config.allocation_buy_pct[1];
    return [Math.round(cap * lo / 100), Math.round(cap * hi / 100)];
  }
  if (product.categorie === "FUTURE_CLASSIC") {
    const lo = RADAR.config.allocation_future_classic_pct[0];
    const hi = RADAR.config.allocation_future_classic_pct[1];
    return [Math.round(cap * lo / 100), Math.round(cap * hi / 100)];
  }
  return [0, 0];
}

function render(data) {
  RADAR = data;
  const s = data.summary;
  const capital = getEffectiveCapital();
  const engaged = s.capital_engaged || 0;
  const available = capital - engaged;

  const nBuy = data.products.filter(p => p.decision === "BUY" || p.decision === "STRONG_BUY").length;
  // V4 : la posture vient du moteur (summary.posture), jamais deduite ici.
  // Ancien radar sans posture : prudence, un echec de collecte n'est pas un CASH.
  const nFail = data.products.filter(p => p.decision === "NO_DATA" || p.decision === "ERROR").length;
  if (!s.data_status) {
    s.data_status = data.products.length === 0 ? "NO_DATA" : (nFail === data.products.length ? "FAILED" : (nFail ? "PARTIAL" : "OK"));
    s.coverage = data.products.length ? (data.products.length - nFail) / data.products.length : 0;
  }
  const posture = s.posture || (nBuy > 0 ? "SIGNALS" : (nFail > 0 || data.products.length === 0 ? "NO_CONCLUSION" : "CASH"));
  let decisionTxt, decisionSub;
  if (nBuy > 0) {
    decisionTxt = `${nBuy} signal${nBuy > 1 ? "x" : ""} d'achat détecté${nBuy > 1 ? "s" : ""}`;
    decisionSub = s.data_status === "PARTIAL"
      ? "Données partielles : certains produits n'ont pas pu être évalués."
      : "Ouvre un produit pour voir la thèse.";
  } else if (posture === "CASH") {
    decisionTxt = "CASH — Aucun signal actif";
    decisionSub = "Tous les produits ont été évalués ; aucun n'est sous sa cible.";
  } else {
    decisionTxt = `Aucune conclusion — données ${esc(s.data_status || "insuffisantes")}`;
    decisionSub = `Couverture ${Math.round((s.coverage || 0) * 100)} % : impossible de conclure CASH.`;
  }

  let html = '';

  // Command Center
  if (!isLegacy()) {
    html += `
    <div class="command">
      <div class="command-top">
        <div>
          <div class="capital-label">Capital</div>

  // https://<owner>.github.io/<repo>/  ->  owner/repo

  if (h.endsWith(".github.io") && seg.length) return { owner: h.split(".")[0], repo: seg[0] };
  return { owner: "leseke", repo: "Edge-collector" };
}

// ---------------- EDGE Intelligence Reports v1 (lecture seule) ----------------
// Le niveau de verification vient de l'index (calcule par le validateur a la
// publication). L'avis IA n'est jamais affiche comme une decision. Les
// graphiques n'utilisent que les points du rapport : aucun chiffre ajoute.
const INTEL = { index: null, current: null };
const KIND_LABEL = { fact: "Faits (citations exactes)", interpretation: "Interprétations de l'IA (non vérifiées)",
                     hypothesis: "Hypothèses (IA ou humain)", uncertainty: "Incertitudes",
                     limitation: "Limites méthodologiques", invalidated: "Conclusions infirmées" };

// Actualite evaluee A LA CONSULTATION (pas a la publication). Sans politique
// declaree : 30 j par defaut (prudence). Index ancien sans data_as_of : inconnue.
function intelTimeliness(dataAsOf, maxDays) {
  const max = Number.isInteger(maxDays) ? maxDays : 30;
  const t = Date.parse(dataAsOf || "");
  if (isNaN(t)) return { status: "unknown", max, age: null };
  const age = (Date.now() - t) / 86400000;
  if (age < 0) return { status: "unknown", max, age };
  return { status: age <= max ? "current" : "stale", max, age };
}

function intelBadge(level) {
  const cls = level === "fully_verified" ? "buy" : (level === "partially_verified" ? "wait" : "watch");
  return `<span class="badge ${cls}">${esc(level)}</span>`;
}

function renderIntel() {
  const idx = INTEL.index;
  if (!idx || !idx.reports || !idx.reports.length) { document.getElementById("intel").innerHTML = ""; return; }
  const latest = {};
  idx.reports.forEach(e => { if (!latest[e.report_id] || e.report_version > latest[e.report_id].report_version) latest[e.report_id] = e; });
  const rows = Object.values(latest).map(e => `
    <div class="item" onclick="openIntel('${esc(e.report_id)}', ${Number(e.report_version)})">
      <div class="thumb">📑</div>
      <div class="info"><div class="name">${esc(e.title)}${e.simulated ? '<span class="sim-tag">SIMULÉ</span>' : ''}</div>
        <div class="meta">${esc(e.region)} · v${Number(e.report_version)} · ${esc(e.production_status)} · ${fmtDate(e.created_at)}</div></div>
      <div class="right">${intelBadge(e.verification_level)}${intelTimeliness(e.data_as_of, e.max_data_age_days).status !== "current" ? ' <span class="badge no_data">' + (intelTimeliness(e.data_as_of, e.max_data_age_days).status === "stale" ? "périmé" : "actualité ?") + '</span>' : ""}</div>
    </div>`).join("");
  document.getElementById("intel").innerHTML =
    `<div class="section"><div class="section-title">Rapports d'analyse</div>${rows}</div>`;
}

function intelChart(r, ch) {
  const ds = ch.dataset_ids.map(id => r.datasets.find(d => d.dataset_id === id)).filter(Boolean);
  const pts = ds.flatMap(d => d.points.filter(p => p.value !== null));
  if (!pts.length) return `<div class="lab-out">Aucune donnée.</div>`;
  const times = [...new Set(ds.flatMap(d => d.points.map(p => p.t)))].sort();
  const vals = pts.map(p => p.value), lo = Math.min(...vals), hi = Math.max(...vals);
  const W = 320, H = 140, pad = 24;
  const x = t => pad + (times.indexOf(t) / Math.max(1, times.length - 1)) * (W - 2 * pad);
  const y = v => H - pad - ((v - lo) / ((hi - lo) || 1)) * (H - 2 * pad);
  const colors = ["#4ade80", "#60a5fa", "#fbbf24", "#f472b6"];
  let svg = "";
  ds.forEach((d, i) => {
    const c = colors[i % colors.length];
    if (ch.type === "bar") {
      const bw = Math.max(2, (W - 2 * pad) / times.length / ds.length - 2);
      d.points.forEach(p => { if (p.value !== null) svg += `<rect x="${x(p.t) - bw / 2 + i * bw}" y="${y(p.value)}" width="${bw}" height="${H - pad - y(p.value)}" fill="${c}" opacity="${p.status === "measured" ? 1 : 0.5}"/>`; });
    } else {
      let seg = [];
      const flush = () => { if (seg.length > 1) svg += `<polyline fill="none" stroke="${c}" stroke-width="2" ${seg.dashed ? 'stroke-dasharray="4 3"' : ""} points="${seg.join(" ")}"/>`; seg = []; };
      d.points.forEach(p => {
        if (p.value === null) { flush(); return; }   // donnée manquante : trou, jamais interpolée
        seg.push(`${x(p.t)},${y(p.value)}`); if (p.status !== "measured") seg.dashed = true;
        svg += `<circle cx="${x(p.t)}" cy="${y(p.value)}" r="2.5" fill="${c}"/>`;
      });
      flush();
    }
  });
  const sim = ds.some(d => d.simulated);
  const unit = ds[0].unit === "currency" ? ds[0].currency : ds[0].unit;
  const legend = ds.map((d, i) => `<span style="color:${colors[i % colors.length]}">■</span> ${esc(d.title)} (${d.points.filter(p => p.value === null).length} manquant(s))`).join("<br>");
  return `<svg viewBox="0 0 ${W} ${H}" width="100%" role="img" aria-label="${esc(ch.title)}">
      ${sim ? `<text x="${W / 2}" y="${H / 2}" text-anchor="middle" font-size="18" fill="#fbbf24" opacity="0.35">DONNÉES SIMULÉES</text>` : ""}
      ${svg}<text x="${pad}" y="12" font-size="10" fill="#94a3b8">${esc(unit)} · max ${hi} · min ${lo}</text></svg>
    <div class="lab-out">${legend}</div>`;
}

function openIntel(id, version) {
  if (!/^eir_[a-z0-9][a-z0-9_.-]{1,63}$/.test(id) || !Number.isInteger(version)) return;
  const e = (INTEL.index.reports || []).find(x => x.report_id === id && x.report_version === version);
  if (!e || !/^reports\/[a-z0-9_.-]+\/v\d{4}\.json$/.test(e.path)) return;
  getJSON("data/intelligence/" + e.path).then(r => {
    if (!r) return;
    INTEL.current = r;
    const src = {}; r.sources.forEach(s => src[s.source_id] = s);
    const cite = ids => ids.length ? ids.map(i => src[i] ? esc(src[i].publisher) + (src[i].simulated ? " (fictive)" : "") : esc(i)).join(", ") : "aucune source";
    let html = `<div class="sheet-body"><div class="sheet-title">${esc(r.subject.title)}</div>
      <div class="sheet-cat">${esc(r.subject.market)} · ${esc(r.subject.region)} · v${r.report_version} · données au ${fmtDate(r.data_as_of)}</div>
      <div class="sheet-block"><div class="lbl">Fiabilité (à la rédaction)</div><div class="txt ${e.verification_level === "fully_verified" ? "" : "warn"}">${esc(e.label)}</div></div>`;
    const tl = intelTimeliness(r.data_as_of, (r.freshness || {}).max_data_age_days);
    html += `<div class="sheet-block"><div class="lbl">Actualité (à la consultation)</div><div class="txt ${tl.status === "current" ? "" : "danger"}">` +
      (tl.status === "current" ? `Données du ${fmtDate(r.data_as_of)} : à jour (limite ${tl.max} j)` :
       tl.status === "stale" ? `DONNÉES PÉRIMÉES : ${Math.floor(tl.age)} j > ${tl.max} j${(r.freshness || {}).max_data_age_days ? "" : " (politique par défaut)"} — ne pas considérer comme actuel` :
       "Actualité inconnue") + `</div></div>`;
    r.charts.forEach(ch => { html += `<div class="sheet-block"><div class="lbl">${esc(ch.title)}</div>${intelChart(r, ch)}</div>`; });
    Object.keys(KIND_LABEL).forEach(k => {
      const cs = r.claims.filter(c => c.kind === k);
      if (!cs.length) return;
      html += `<div class="sheet-block"><div class="lbl">${KIND_LABEL[k]}</div><div class="txt">` + cs.map(c =>
        `${esc(c.statement)}${c.source_claim_type && c.source_claim_type !== "fact" ? ' <span class="sim-tag">' + esc({opinion: "opinion de la source", commercial_claim: "affirmation commerciale", estimate: "estimation de la source"}[c.source_claim_type] || c.source_claim_type) + '</span>' : ""} <span style="color:#64748b">[${esc(c.verification)} · ${esc(c.author)} · ${cite(c.source_ids)}]</span>`).join("<br>") + `</div></div>`;
    });
    if ((r.computations || []).length) {
      const meth = { pct_change: "variation en %", difference: "différence", mean: "moyenne", min: "minimum", max: "maximum" };
      html += `<div class="sheet-block"><div class="lbl">Calculs déterministes EDGE (recalculés à chaque validation)</div><div class="txt">` +
        r.computations.map(c => `${esc(meth[c.method] || c.method)} de ${esc(c.dataset_id)} du ${esc(c.t_from)} au ${esc(c.t_to)} : ` +
          `<b>${Number(c.result).toFixed(2)}</b> ${c.unit === "percent" ? "%" : esc(c.currency || c.unit)} <span style="color:#64748b">(${c.inputs.length} points d'entrée)</span>`).join("<br>") + `</div></div>`;
    }
    const op = r.decisions.agent_opinion, ed = r.decisions.edge_decision;
    if (op) html += `<div class="sheet-block"><div class="lbl">Avis analytique de l'agent (pas une décision)</div><div class="txt">${esc(op.stance)} — ${esc(op.rationale)}</div></div>`;
    html += `<div class="sheet-block"><div class="lbl">Décision EDGE (moteur)</div><div class="txt">${esc(ed.decision)}${ed.decided_by === "none" ? " — non évaluée par le moteur" : ""}</div></div>`;
    const ec = r.economics;
    html += `<div class="sheet-block"><div class="lbl">Économie</div><div class="txt">Achetabilité vérifiée : ${ec.availability.buyable_verified ? "oui" : "non"} · frais vérifiés : ${ec.fees.verified ? "oui" : "non"}<br>` +
      ec.roi_hypotheses.map(h => `Hypothèse ${esc(h.scenario)} : ROI net ${Number(h.net_roi_pct)} %`).join("<br>") + `</div></div>`;
    const h = r.history;
    if (h.corrections.length || h.conclusion_changes.length) html += `<div class="sheet-block"><div class="lbl">Historique</div><div class="txt warn">` +
      h.corrections.map(c => `${esc(c.description)} (${esc(c.reason)})`).concat(h.conclusion_changes.map(c => `${esc(c.from)} → ${esc(c.to)} : ${esc(c.reason)}`)).join("<br>") + `</div></div>`;
    html += `<div class="sheet-block"><div class="lbl">Sources</div><div class="txt">` + r.sources.map(s =>
      `${esc(s.publisher)} — ${esc(s.title)} [${esc(s.tier)}${s.simulated ? ", fictive" : ""}] consulté le ${esc(s.accessed_at)}`).join("<br>") + `</div></div></div>`;
    document.getElementById("sheet-content").innerHTML = html;
    document.getElementById("overlay").classList.add("open");
    document.getElementById("sheet").classList.add("open");
  });
}

function reloadIntel() {
  getJSON("data/intelligence/index.json").then(idx => { INTEL.index = idx; renderIntel(); });
}

SIM_CAPITAL = loadSimCapital();
reload();
reloadLab();
reloadIntel();
</script>
