name: EDGE security workflow policy
on:
  push:
    branches:
      - edge/security-hardening-001
    paths:
      - '.github/workflows/**'
      - 'tests/security-workflow-policy.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/**'
      - 'tests/security-workflow-policy.test.mjs'
permissions:
  contents: read
jobs:
  workflow-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Verify Cloudflare workflow is non-mutating
        run: node --test tests/security-workflow-policy.test.mjs
