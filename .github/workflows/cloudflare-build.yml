name: Cloudflare Workers build

on:
  pull_request:
  push:
    branches:
      - edge/cloudflare-migration-001

permissions:
  contents: read

jobs:
  cloudflare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Offline D1 schema compatibility tests
        run: python3 -m unittest discover -s cloud/collector/test -p 'test_*.py' -v
      - name: Offline collector parser tests
        run: node --test cloud/collector/test/*.test.mjs
      - name: Typecheck isolated Cloudflare collector
        run: npx tsc --project cloud/collector/tsconfig.json
      - name: Type check
        run: npm run typecheck
      - name: Build for Cloudflare Workers
        run: npm run cf:build
