name: EDGE isolated dependency lock generation

on:
  push:
    branches:
      - edge/security-hardening-001
    paths:
      - '.github/workflows/dependency-lock.yml'
      - 'package.json'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-security-lock-generation
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Resolve npm dependencies without lifecycle scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund
      - name: Verify generated lockfile
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const manifest=JSON.parse(fs.readFileSync('package.json'));
          const lock=JSON.parse(fs.readFileSync('package-lock.json'));
          if(lock.lockfileVersion!==3 || lock.name!==manifest.name ||
             JSON.stringify(lock.packages[''].dependencies)!==JSON.stringify(manifest.dependencies) ||
             JSON.stringify(lock.packages[''].devDependencies)!==JSON.stringify(manifest.devDependencies))
            throw new Error('lockfile_manifest_mismatch');
          console.log('Generated reproducible npm dependency manifest');
          JS
      - uses: actions/upload-artifact@v4
        with:
          name: edge-npm-lock
          path: package-lock.json
          if-no-files-found: error
          retention-days: 7

  commit-isolated-lock:
    needs: resolve
    if: github.event_name == 'push' && github.repository == 'leseke/Edge-collector' && github.ref == 'refs/heads/edge/security-hardening-001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
        with:
          ref: edge/security-hardening-001
          persist-credentials: true
      - uses: actions/download-artifact@v4
        with:
          name: edge-npm-lock
          path: .
      - name: Validate lockfile before committing
        run: |
          node - <<'JS'
          const fs=require('node:fs');
          const m=JSON.parse(fs.readFileSync('package.json'));
          const l=JSON.parse(fs.readFileSync('package-lock.json'));
          if(l.lockfileVersion!==3 || l.name!==m.name ||
             JSON.stringify(l.packages[''].dependencies)!==JSON.stringify(m.dependencies) ||
             JSON.stringify(l.packages[''].devDependencies)!==JSON.stringify(m.devDependencies))
            throw new Error('lockfile_not_matching_manifest');
          JS
      - name: Write lockfile only to isolated development branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- package-lock.json
          if git diff --cached --quiet; then
            echo "Dependency lockfile unchanged."
          else
            git commit -m "chore(security): commit isolated reproducible npm lockfile"
            git push origin HEAD:refs/heads/edge/security-hardening-001
          fi
