name: EDGE MRI offline tests

on:
  push:
    branches:
      - "edge/mri-004-*"
    paths:
      - "collect.py"
      - "connectors/**"
      - "storage.py"
      - "intelligence/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/mri-tests.yml"
  pull_request:
    paths:
      - "collect.py"
      - "connectors/**"
      - "storage.py"
      - "intelligence/**"
      - "tests/**"
      - "requirements.txt"
      - ".github/workflows/mri-tests.yml"

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - name: Run offline unit tests
        run: python -m unittest discover -s tests -v
