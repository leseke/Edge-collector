name: EDGE Pages publication
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'index.html'
      - 'mri/**'
      - 'radar.json'
      - 'portfolio.json'
      - '*.md'
      - '**.css'
      - '**.js'
      - 'assets/**'
      - 'images/**'
      - '_config.yml'
      - '.github/workflows/pages.yml'
      - 'tests/test_edge_live.mjs'
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: read
    steps:
      - uses: actions/checkout@v4
      - name: Test verified capture loading and unknown states
        run: node --test tests/test_edge_live.mjs
      - name: Read Pages configuration
        uses: actions/configure-pages@v5
      - name: Record the source revision before the container build
        env:
          PUBLISHED_SOURCE_SHA: ${{ github.sha }}
          PUBLISHED_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PYMARKER'
          import json, os
          from pathlib import Path
          Path('deployment.json').write_text(json.dumps({
              'source_sha':os.environ['PUBLISHED_SOURCE_SHA'],
              'run_id':os.environ['PUBLISHED_RUN_ID'],
              'workflow':'EDGE Pages publication'
          },indent=2))
          PYMARKER
      - name: Build the existing public site
        uses: actions/jekyll-build-pages@v1
        with:
          source: ./
          destination: ./_site
      - name: Validate public entry points and record source revision
        env:
          PUBLISHED_SOURCE_SHA: ${{ github.sha }}
          PUBLISHED_RUN_ID: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from pathlib import Path
          root=Path('_site')
          for name in ('index.html','mri/index.html','assets/edge-live.css','assets/edge-live.mjs','assets/edge-data.mjs','deployment.json'):
              path=root/name
              if not path.is_file() or not path.stat().st_size:
                  raise SystemExit('Missing public entry point: '+name)
              if name.endswith('.json'):
                  json.loads(path.read_text())
          revision=json.loads((root/'deployment.json').read_text())
          assert revision['source_sha']==os.environ['PUBLISHED_SOURCE_SHA']
          assert revision['run_id']==os.environ['PUBLISHED_RUN_ID']
          print('Public HTML/JSON entry points verified.')
          PY
      - name: Upload public site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: ./_site
  deploy:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.publication.outputs.page_url }}
    steps:
      - name: Publish the verified artifact
        id: publication
        uses: actions/deploy-pages@v5
