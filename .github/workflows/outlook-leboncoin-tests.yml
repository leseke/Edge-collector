name: EDGE Outlook Leboncoin ingestion tests
on:
  push:
    branches:
      - edge/outlook-leboncoin-ingestion-001
    paths:
      - 'cloud/collector/src/leboncoin-*.mjs'
      - 'cloud/collector/test/leboncoin*.test.mjs'
      - 'cloud/collector/test/test_leboncoin*.py'
      - 'cloud/collector/migrations/00*_outlook_*.sql'
      - '.github/workflows/outlook-leboncoin-tests.yml'
  pull_request:
    paths:
      - 'cloud/collector/src/leboncoin-*.mjs'
      - 'cloud/collector/test/leboncoin*.test.mjs'
      - 'cloud/collector/test/test_leboncoin*.py'
      - 'cloud/collector/migrations/00*_outlook_*.sql'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parser:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Run deterministic offline parser and Graph contract tests
        run: node --test cloud/collector/test/leboncoin-email.test.mjs cloud/collector/test/leboncoin-d1.test.mjs cloud/collector/test/leboncoin-sync.test.mjs cloud/collector/test/leboncoin-delta.test.mjs cloud/collector/test/leboncoin-oauth.test.mjs cloud/collector/test/leboncoin-delta-store.test.mjs cloud/collector/test/leboncoin-consent.test.mjs cloud/collector/test/leboncoin-oauth-store.test.mjs cloud/collector/test/leboncoin-consent-http.test.mjs cloud/collector/test/leboncoin-identity.test.mjs cloud/collector/test/leboncoin-access-session.test.mjs cloud/collector/test/leboncoin-access-consent.test.mjs
      - name: Verify append-only D1 migration (SQLite compatibility)
        run: python -m unittest discover -s cloud/collector/test -p 'test_leboncoin*.py'
