name: EDGE security dependency and history audit

on:
  push:
    branches:
      - edge/security-hardening-001
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'requirements.txt'
      - '.github/workflows/security-audit.yml'
  pull_request:
    paths:
      - 'package-lock.json'
      - 'package.json'
      - 'requirements.txt'
      - '.github/workflows/security-audit.yml'

permissions:
  contents: read

jobs:
  node-advisories:
    name: npm dependency advisories
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - name: Require committed lockfile and install without scripts
        run: npm ci --ignore-scripts --no-audit --no-fund
      - name: Audit production and development dependencies
        shell: bash
        run: |
          set +e
          npm audit --json > "$RUNNER_TEMP/npm-audit.json"
          audit_exit=$?
          set -e
          node - "$RUNNER_TEMP/npm-audit.json" "$audit_exit" <<'JS'
          const fs=require('node:fs');
          const report=JSON.parse(fs.readFileSync(process.argv[2],'utf8'));
          const n=report.metadata?.vulnerabilities||{};
          console.log('npm vulnerabilities by severity:',JSON.stringify(n));
          if(Number(process.argv[3])!==0) process.exitCode=1;
          JS

  python-advisories:
    name: Python requirements advisory scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install advisory scanner only
        run: python -m pip install pip-audit
      - name: Check unpinned requirements (read-only)
        run: pip-audit --requirement requirements.txt --progress-spinner off

  secret-history:
    name: Check Git history for leaked credentials
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - uses: gitleaks/gitleaks-action@ff98106e4c7b2bc287b24eaf42907196329070c7 # v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
