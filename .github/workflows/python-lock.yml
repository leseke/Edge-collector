name: EDGE isolated Python lock generation

on:
  push:
    branches:
      - edge/security-hardening-001
    paths:
      - '.github/workflows/python-lock.yml'
      - 'requirements.txt'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: edge-security-python-lock
  cancel-in-progress: false

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'
      - name: Install pip-tools in disposable runner
        run: python -m pip install --disable-pip-version-check pip-tools
      - name: Generate dependency hashes without accessing private APIs
        run: pip-compile --generate-hashes --resolver=backtracking --output-file=requirements.lock requirements.txt
      - name: Verify reproducible Python installation
        run: python -m pip install --require-hashes --no-deps -r requirements.lock
      - name: Validate resolved dependencies
        run: python -m pip check
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: edge-python-lock
          path: requirements.lock
          retention-days: 7
          if-no-files-found: error

  commit-isolated-lock:
    needs: resolve
    if: github.event_name == 'push' && github.repository == 'leseke/Edge-collector' && github.ref == 'refs/heads/edge/security-hardening-001'
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: edge/security-hardening-001
          persist-credentials: true
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: edge-python-lock
          path: .
      - name: Verify lock content is hashed and matches direct requirements
        run: |
          python - <<'PY'
          from pathlib import Path
          import re
          contents=Path('requirements.lock').read_text()
          direct=[line.strip().lower() for line in Path('requirements.txt').read_text().splitlines() if line.strip() and not line.startswith('#')]
          assert len(contents) < 600000
          assert all(re.search(r'(?m)^'+re.escape(name)+r'==[0-9]', contents) for name in direct)
          assert '--hash=sha256:' in contents
          assert '--index-url' not in contents and '--extra-index-url' not in contents
          PY
      - name: Commit only requirements.lock to isolated branch
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -- requirements.lock
          if ! git diff --cached --quiet; then
            git commit -m "chore(security): add hashed Python dependency lock"
            git push origin HEAD:refs/heads/edge/security-hardening-001
          fi
