name: EDGE TCGdex research collector
on:
  workflow_dispatch:
  schedule:
    - cron: '17 6 * * *'
permissions:
  contents: write
jobs:
  capture:
    concurrency:
      group: edge-tcgdex-research-history
      cancel-in-progress: false
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Capture validated French catalogue
        run: |
          python - <<'PY'
          import hashlib,json,urllib.request,datetime,pathlib
          from intelligence.tcgdex_catalogue_review import inspect_tcgdex_sets
          observed=datetime.datetime.now(datetime.timezone.utc).isoformat(timespec='seconds').replace('+00:00','Z')
          request=urllib.request.Request('https://api.tcgdex.net/v2/fr/sets',headers={'Accept':'application/json','User-Agent':'EDGE-Catalogue-Research/1.0'})
          with urllib.request.urlopen(request,timeout=12) as response:
              if response.status!=200: raise ValueError('HTTP error')
              raw=response.read(1000001)
          result=inspect_tcgdex_sets(raw,observed_at=observed)
          root=pathlib.Path('catalogue-snapshot')
          root.mkdir(exist_ok=True)
          (root/'catalogue.json').write_bytes(raw)
          (root/'report.json').write_text(json.dumps(result,ensure_ascii=False,sort_keys=True),encoding='utf-8')
          print('Validated catalogue extensions:',result['set_count'])
          PY
      - name: Append immutable snapshot to dedicated history branch
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          mkdir -p /tmp/edge-history-capture
          cp catalogue-snapshot/catalogue.json /tmp/edge-history-capture/catalogue.json
          cp catalogue-snapshot/report.json /tmp/edge-history-capture/report.json
          if git ls-remote --exit-code origin refs/heads/edge/tcgdex-history >/dev/null 2>&1; then
            git fetch origin edge/tcgdex-history
            git checkout -B edge/tcgdex-history FETCH_HEAD
          else
            git checkout --orphan edge/tcgdex-history
            git rm -rf --quiet . || true
          fi
          id="${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          folder="snapshots/${id}"
          test ! -e "$folder"
          mkdir -p "$folder"
          cp /tmp/edge-history-capture/* "$folder/"
          git add "$folder"
          git commit -m "data(tcgdex): immutable French catalogue snapshot ${id}"
          git push origin HEAD:refs/heads/edge/tcgdex-history
      - name: Upload temporary evidence independently from the application
        uses: actions/upload-artifact@v4
        with:
          name: tcgdex-fr-snapshot
          path: catalogue-snapshot/
          retention-days: 30
