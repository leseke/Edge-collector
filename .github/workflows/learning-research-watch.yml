name: EDGE Learning research watch
on:
  workflow_dispatch:
  schedule:
    - cron: "43 8 * * 1,4"
permissions:
  contents: read
jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Collect public research abstracts as unreviewed source material
        run: python -m tools.collect_learning_feeds --output learning-watch/review.json
      - name: Enforce no adoption or trade policy changes
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          r=json.loads(Path("learning-watch/review.json").read_text())
          assert r["schema"]=="edge.learning.intake_review.v1"
          assert r["lessons_adopted"]==0 and not r["learning_applied"]
          assert not r["changes_investment_policy"]
          assert all(x["status"]=="UNREVIEWED_SOURCE" for x in r["sources"])
          print("Research only:",r["source_count"],"sources")
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: edge-learning-unreviewed-sources
          path: learning-watch/
          retention-days: 7
          if-no-files-found: error
