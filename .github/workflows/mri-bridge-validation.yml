name: EDGE MRI Bridge validation
on:
  pull_request:
    paths:
      - "intelligence/public_mri_export.py"
      - "intelligence/mri_public_adapter.py"
      - "tests/test_public_mri_export.py"
      - "tests/test_mri_public_adapter.py"
      - "tests/test_public_mri_preview.py"
      - "preview/**"
      - ".github/workflows/mri-bridge-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only dependency
        run: python -m pip install requests
      - name: MRI bridge tests
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          python -m unittest tests.test_public_mri_export tests.test_public_mri_preview tests.test_mri_public_adapter -v
      - name: Complete offline test suite (local simulation)
        # Remove the CI marker solely within this test process and its child
        # fixtures: the production SpendGuard still refuses monthly caps in CI.
        # Offline runner explicitly rejects network connections.
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: |
          env -u GITHUB_ACTIONS python -m tools.run_tests_offline
      - name: Publication safety inspection
        run: |
          python -m tools.check_public_files --tracked
