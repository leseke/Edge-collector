      - "preview/**"
      - ".github/workflows/mri-bridge-validation.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install test-only dependencies
        run: python -m pip install requests playwright
      - name: MRI bridge unit tests
        run: python -m unittest tests.test_public_mri_export tests.test_public_mri_preview tests.test_mri_public_adapter tests.test_build_mri_preview tests.test_prepare_mri_public_release tests.test_mri_observation_ingest tests.test_mri_official_collector tests.test_mri_evidence_segments tests.test_mri_evidence_events tests.test_mri_source_comparison tests.test_opportunity_v1 tests.test_market_evidence tests.test_prediction_journal tests.test_learning_intelligence tests.test_learning_library tests.test_learning_acquisition tests.test_stage_learning_sources tests.test_collect_learning_feeds tests.test_private_learning_evaluation tests.test_learning_prediction_bridge tests.test_learning_commitment_ledger tests.test_external_witness tests.test_github_witness_check tests.test_sale_outcome_evidence_gate tests.test_prospective_learning_gate tests.test_sales_source_typing tests.test_market_snapshot_intake tests.test_completed_sale_export tests.test_bricklink_sold_aggregate tests.test_bricklink_oauth_client tests.test_bricklink_observation_journal tests.test_bricklink_collect_record tests.test_tcg_retail_sources tests.test_retail_radar tests.test_retail_transition_engine tests.test_retail_signal_confirmation tests.test_retail_observation_history tests.test_retail_offline_pilot tests.test_retail_capture_import tests.test_retail_freshness_audit tests.test_retail_capture_batch tests.test_import_retail_captures_cli tests.test_tcgdex_catalogue_review tests.test_review_tcgdex_catalogue_cli tests.test_tcgdex_catalogue_intake -v
      - name: Generate static preview bundle from MRI evidence
        run: |
          mkdir -p preview-dist/data
          cp preview/index.html preview-dist/index.html
          python - <<'PY'
          import json
          from pathlib import Path
          from tools.build_mri_preview import generate
          output=Path("preview-dist/data/mri_public.json")
          generate(output_path=output)
          doc=json.loads(output.read_text(encoding="utf-8"))
          assert doc["schema"]=="edge.mri.public.v1"
          assert len(doc["cases"])==2
          assert all(c["state"]=="RESEARCH_ONLY" for c in doc["cases"])
          print("Generated preview cases:",len(doc["cases"]))
          PY
      - name: Install headless Chromium for browser verification
        run: python -m playwright install --with-deps chromium
      - name: Test generated preview in Chromium
        run: python -m tools.check_mri_preview_browser
      - name: Prepare release proposal (no write to production)
        run: |
          python -m tools.prepare_mri_public_release --output preview-release
          python - <<'PY'
          import json
          from pathlib import Path
          doc=json.loads(Path("preview-release/release_review.json").read_text())
          assert doc["schema"] == "edge.mri.public.release_review.v1"
          assert doc["publication_performed"] is False
          assert doc["purchase_authorized"] is False
          assert doc["public_cases"] >= 1
          print("MRI release proposal:",doc["status"])
          PY
      - name: Complete offline test suite (local simulation)
        env:
          PYTHONDONTWRITEBYTECODE: "1"
          PYTHONNOUSERSITE: "1"
        run: env -u GITHUB_ACTIONS python -m tools.run_tests_offline
      - name: Publication safety inspection
        run: python -m tools.check_public_files --tracked
      - name: Probe official TCGdex FR catalogue (non-blocking research)
        run: |
          mkdir -p catalogue-research
          python - <<'PY'
          import json
          from datetime import datetime, timezone
          from pathlib import Path
          from urllib.request import Request, urlopen
          from tools.review_tcgdex_catalogue import main
          folder=Path("catalogue-research")
          observed=datetime.now(timezone.utc).isoformat(timespec="seconds").replace("+00:00","Z")
          report={"schema":"edge.tcg.research_probe.v1","observed_at":observed,"status":"UNAVAILABLE","products_priced":0,"sales_verified":0}
          try:
              req=Request("https://api.tcgdex.net/v2/fr/sets",headers={"User-Agent":"EDGE-Research/1.0","Accept":"application/json"})
              with urlopen(req, timeout=12) as response:
                  if response.status!=200:raise ValueError("HTTP non-200")
                  body=response.read(1000001)
              if len(body)>1000000:raise ValueError("response too large")
              source=folder/"tcgdex-fr-sets.json"
              source.write_bytes(body)
              reviewed=main(["--input",str(source),"--observed-at",observed])
              report.update(status="VALIDATED",set_count=reviewed["set_count"],sha256=reviewed["source_snapshot_sha256"])
          except Exception as exc:
              report["error_type"]=type(exc).__name__
          (folder/"probe.json").write_text(json.dumps(report,sort_keys=True),encoding="utf-8")
          print("TCGdex catalogue probe status:",report["status"])
          PY
      - name: Verify TCGdex research artifact integrity
        run: |
          python - <<'PY'
          import hashlib
          import json
          from pathlib import Path
          folder=Path("catalogue-research")
          report=json.loads((folder/"probe.json").read_text(encoding="utf-8"))
          assert report["schema"]=="edge.tcg.research_probe.v1"
          assert report["products_priced"]==0 and report["sales_verified"]==0
          snapshot=folder/"tcgdex-fr-sets.json"
          if report["status"]=="VALIDATED":
              assert snapshot.is_file()
              assert hashlib.sha256(snapshot.read_bytes()).hexdigest()==report["sha256"]
              assert report["set_count"]>0
          else:
              assert report["status"]=="UNAVAILABLE"
              if snapshot.exists():snapshot.unlink()
          print("TCGdex artifact integrity:",report["status"])
          PY
      - name: Upload TCGdex research probe (no production write)
        uses: actions/upload-artifact@v4
        with:
          name: edge-tcgdex-research
          path: catalogue-research/
          if-no-files-found: error
          retention-days: 30
      - name: Upload release review proposal (no automatic push)
        uses: actions/upload-artifact@v4
        with:
          name: edge-mri-release-review
          path: preview-release/
          if-no-files-found: error
          retention-days: 7
      - name: Upload isolated generated preview (no GitHub Pages deployment)
        uses: actions/upload-artifact@v4
        with:
          name: edge-mri-preview
          path: preview-dist/
          if-no-files-found: error
          retention-days: 7
