name: EDGE Outlook bootstrap security gate
on:
  push:
    branches:
      - edge/outlook-bootstrap-security-001
    paths:
      - '.github/workflows/outlook-bootstrap-deploy.yml'
      - '.github/workflows/outlook-bootstrap-security-tests.yml'
      - 'tests/outlook-bootstrap-deploy-policy.test.mjs'
  pull_request:
    paths:
      - '.github/workflows/outlook-bootstrap-deploy.yml'
      - '.github/workflows/outlook-bootstrap-security-tests.yml'
      - 'tests/outlook-bootstrap-deploy-policy.test.mjs'
permissions:
  contents: read
jobs:
  bootstrap-policy:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: '24'
      - run: node --test tests/outlook-bootstrap-deploy-policy.test.mjs
