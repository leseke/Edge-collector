# SECURITY HARDENING: Previous push-triggered remote D1 creation is intentionally
# removed. Database provisioning must be an independently reviewed operation,
# never a side effect of a development-branch push.
name: EDGE D1 provisioning safety gate

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  review-only:
    name: Confirm provisioning requires separate approval
    runs-on: ubuntu-latest
    timeout-minutes: 3
    steps:
      - name: Display non-mutating activation requirements
        run: |
          echo "No Cloudflare token is loaded by this workflow."
          echo "Remote D1 create, migrate, deploy and cron activation are disabled."
          echo "Provisioning requires a separately reviewed protected-environment workflow."
          echo "No remote resource has been modified by this safety gate."
