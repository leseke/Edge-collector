name: EDGE V3 visual audit
on:
  workflow_dispatch:
  push:
    branches: [edge/gcc-comparables]
    paths:
      - agent-harness/ui-visual-audit.mjs
      - .github/workflows/edge-visual-audit.yml
permissions:
  contents: read
jobs:
  visual:
    if: github.repository == 'leseke/Edge-collector'
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install browser test runner
        run: |
          npm install --no-save --ignore-scripts --no-audit --no-fund playwright@1.58.2
          npx playwright install --with-deps chromium
      - name: Audit actual deployed preview
        run: node agent-harness/ui-visual-audit.mjs
      - name: Preserve real browser screenshots and test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: edge-v3-visual-audit
          path: edge-ui-report/
          retention-days: 7
          if-no-files-found: warn
