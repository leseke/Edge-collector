name: EDGE Collect
on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

jobs:
  collect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements.txt
      - run: python -u collect.py
        env:
          APIFY_TOKEN: ${{ secrets.APIFY_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: storage-db-${{ github.run_number }}
          path: storage.db