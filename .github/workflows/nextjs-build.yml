name: Next.js build

on:
  pull_request:
    branches: [main]
  push:
    branches:
      - edge/tcg-multi-agent-orchestration-001

permissions:
  contents: read

jobs:
  nextjs:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Install dependencies
        run: npm install --no-audit --no-fund
      - name: Type check
        run: npm run typecheck
      - name: Build Next.js
        run: npm run build
